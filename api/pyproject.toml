[project]
name = "clipper-api"
version = "0.1.0"
description = "Clipper backend: YouTube URL -> vertical shorts (FastAPI + local pipeline)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "yt-dlp>=2024.10",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "Pillow>=10.4,<12",
    "ffmpeg-python>=0.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
ai = [
    "openai-whisper>=20240930",
    "mediapipe>=0.10,<0.11",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
clipper-api = "app.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes", "app.models", "app.services", "app.pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
